# 8.7, not the 8.3 Flutter 3.27.1's template ships.
#
# Gradle 8.3 cannot run on Java 21, and Java 21 is what a current Android
# Studio installs — so a fresh machine cloned this and got "Gradle build failed
# due to Java/Gradle incompatibility" before it got a single frame. Gradle
# gained Java 21 support in 8.5.
#
# 8.7 rather than the newest: it is `maxKnownAndSupportedGradleVersion` in
# Flutter 3.27.1's own gradle_utils.dart, and its table pairs AGP 8.0–8.1.99
# with Gradle 8.0–8.7 — so this is the top of the window the pinned Flutter
# actually tests, not past it.
