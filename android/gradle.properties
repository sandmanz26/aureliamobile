org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Two opt-outs AGP 9 needs, and Flutter's own migrator adds them to any project
# that does not already carry them — which is why they kept reappearing as a
# local change and blocking `git pull`.
#
# AGP 9 can compile Kotlin itself, and it brings a new DSL. This project uses
# neither: `app/build.gradle.kts` applies `kotlin-android` and is written in
# the classic `android { }` DSL, exactly as Flutter 3.47.3's own template is.
# Turning both off keeps AGP on the path those files are written for.
android.builtInKotlin=false
android.newDsl=false
