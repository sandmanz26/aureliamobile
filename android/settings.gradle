pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.1.0" apply false
    // 1.9.25, not the 1.8.22 Flutter 3.27.1's template ships. The Kotlin
    // Gradle plugin only learned Java 21 in 1.9.20; under 1.8.22 the compile
    // task reads JDK 21 class files it does not understand and fails with
    // "Unsupported class file major version 65". Same reason as the Gradle
    // bump beside it — see gradle-wrapper.properties.
    id "org.jetbrains.kotlin.android" version "1.9.25" apply false
}

include ":app"
