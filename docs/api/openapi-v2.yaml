        accessToken:
          type: string
        expiresIn:
          type: integer
        refreshToken:
          type: string
      required:
      - accessToken
      - expiresIn
    AuthResponse:
      allOf:
      - $ref: '#/components/schemas/AuthTokens'
      - type: object
        properties:
          user:
            $ref: '#/components/schemas/Me'
