# Aurelia API contract v2: the Pilot slice (OpenAPI 3.1). Draft; API-CONTRACT-V2.md wins.
openapi: 3.1.0
info:
  title: 'Aurelia API: the Pilot slice'
  version: 2.0.0-draft
  description: Contract v2 (draft for the v1 feature lock). The prose in docs/api/API-CONTRACT-V2.md wins over this file.
    x-status marks each operation v1, new in v2 or changed in v2.
servers:
- url: https://api.aurelia.care/v1
- url: https://api.staging.aurelia.care/v1
tags:
- name: Accounts
- name: Core loop
- name: Safety
- name: Creator retreat
- name: Plus
- name: Compute
- name: Outcomes
- name: Admin
- name: Healing model
  description: StateFlips, AKPs, chapters, check-ins (U146). x-admin-only marks what never reaches an app.
paths:
  /auth/signup:
    post:
      tags:
      - Accounts
      summary: Create an account (age gate)
      operationId: post_auth_signup
      x-status: changed in v2
      x-auth: public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        default:
          $ref: '#/components/responses/Problem'
  /auth/signin:
