components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
    adminBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Staff token, aud=admin
    stripeSignature:
      type: apiKey
      in: header
      name: Stripe-Signature
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Problem:
      description: RFC 9457 problem details
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Money:
      type: object
      properties:
        amount:
          type: integer
        currency:
          type: string
          enum:
          - EUR
          - USD
          - IDR
      required:
      - amount
      - currency
    Problem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        detail:
          type: string
        retryable:
          type: boolean
        requestId:
          type: string
      required:
      - type
      - title
      - status
      - code
    SignupRequest:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
        name:
          type: string
        birthYear:
          type: integer
        country:
          type: string
        acceptTermsVersion:
          type: string
      required:
      - email
      - password
      - name
      - birthYear
      - country
      - acceptTermsVersion
    SigninRequest:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required:
      - email
      - password
    OAuthRequest:
      type: object
      properties:
        code:
          type: string
        redirectUri:
          type: string
        birthYear:
          type: integer
        country:
          type: string
      required:
      - code
      - redirectUri
    RefreshRequest:
      type: object
      properties:
        refreshToken:
          type: string
