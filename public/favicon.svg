<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Aurelia mark: gold-to-orange tile, white sweep, white dot.
       Redrawn from src/assets/aurelia-mark.png so the tab icon matches the
       in-app logo; keep the two in step if the mark changes. -->
  <defs>
    <linearGradient id="tile" x1="60" y1="4" x2="4" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFDA70"/>
      <stop offset="0.5" stop-color="#FFAE3C"/>
      <stop offset="1" stop-color="#FF8A1F"/>
    </linearGradient>
    <clipPath id="r"><rect width="64" height="64" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="64" height="64" fill="url(#tile)"/>
    <path d="M-2 27 C 14 19, 34 9, 60 -1 C 38 12, 18 24, -2 38 Z" fill="#fff"/>
    <circle cx="41.5" cy="41" r="11.5" fill="#fff"/>
  </g>
</svg>
